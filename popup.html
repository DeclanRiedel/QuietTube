<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unhook Playables</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">▶ <strong>Unhook Playables</strong></div>
    <p>Choose what YouTube shows.</p>
  </header>
  <label class="pause-control" for="paused">
    <span><strong>Pause extension</strong><small>Show YouTube normally</small></span>
    <input id="paused" type="checkbox">
  </label>
  <label class="preset-control" for="preset">
    <span>Preset</span>
    <select id="preset">
      <option value="custom">Custom</option>
    </select>
  </label>
  <main id="settings" aria-label="YouTube settings"></main>
  <footer>
    <button id="enable-all" type="button">Enable all</button>
    <button id="disable-all" type="button">Disable all</button>
    <span id="status" role="status" aria-live="polite"></span>
  </footer>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
