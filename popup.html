<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuiteTube</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <button id="pause-toggle" type="button" aria-label="Pause QuiteTube" aria-pressed="false" title="Pause QuiteTube">
      <img id="pause-icon" src="icon.svg" alt="" width="40" height="40">
    </button>
    <div class="brand">
      <strong>QuiteTube</strong>
      <p>Hide what you don't want from YouTube.</p>
    </div>
  </header>
  <label class="preset-control" for="preset">
    <span>Preset</span>
    <select id="preset">
      <option value="custom">Custom</option>
    </select>
  </label>
  <main id="settings" aria-label="YouTube settings"></main>
  <p id="error" role="alert" hidden></p>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
